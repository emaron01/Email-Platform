services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: email_platform_test
      POSTGRES_PASSWORD: email_platform_test
      POSTGRES_DB: email_platform_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_platform_test -d email_platform_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - email-platform-test-pg:/var/lib/postgresql/data

volumes:
  email-platform-test-pg:
